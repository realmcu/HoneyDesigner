name: Update Simulation Libraries

on:
  schedule:
    - cron: '0 2 * * *'      # 每天 UTC 02:00
  workflow_dispatch:           # 手动触发
  repository_dispatch:         # 联动触发（HoneyGUI 仓库 push 时可发送此事件）
    types: [honeygui-sdk-updated]

jobs:
  # ── Linux: libgui.a + liblvgl.a ─────────────────────────────────────
  update-libs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Clone HoneyGUI SDK
        run: git clone --depth 1 https://github.com/realmcu/HoneyGUI.git /tmp/HoneyGUI

      - name: Get SDK commit info
        id: sdk-info
        run: |
          echo "sha=$(git -C /tmp/HoneyGUI rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "message=$(git -C /tmp/HoneyGUI log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Cache Linux libgui.a
        id: cache-linux
        uses: actions/cache@v4
        with:
          path: /tmp/HoneyGUI/lib/gcc/install
          key: libgui-linux-${{ steps.sdk-info.outputs.sha }}

      - name: Build libgui.a for Linux
        if: steps.cache-linux.outputs.cache-hit != 'true'
        run: |
          cd /tmp/HoneyGUI/lib/gcc
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          make install

      - name: Update lib/sim with freshly built library
        run: |
          if [ -f /tmp/HoneyGUI/lib/gcc/install/lib/libgui.a ]; then
            cp /tmp/HoneyGUI/lib/gcc/install/lib/libgui.a lib/sim/linux/libgui.a
            echo "✅ Linux libgui.a updated"
          fi
          if [ -d /tmp/HoneyGUI/lib/gcc/install/include ]; then
            rm -rf lib/sim/include/*
            cp -r /tmp/HoneyGUI/lib/gcc/install/include/* lib/sim/include/
            echo "✅ Headers updated"
          fi

      - name: Get LVGL commit hash
        id: lvgl-info
        run: |
          for i in 1 2 3; do
            sha=$(git ls-remote https://gitee.com/realmcu/lvgl.git refs/heads/lvgl_v9 | cut -f1)
            [ -n "$sha" ] && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ -z "$sha" ]; then
            echo "⚠️ Failed to get LVGL sha after 3 attempts, skipping LVGL update"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache Linux liblvgl.a
        id: cache-lvgl-linux
        if: steps.lvgl-info.outputs.sha != ''
        uses: actions/cache@v4
        with:
          path: lvgl-pc/lvgl-lib-linux
          key: liblvgl-linux-${{ steps.lvgl-info.outputs.sha }}-${{ hashFiles('lvgl-pc/lv_conf.h') }}

      - name: Clone LVGL source
        if: steps.lvgl-info.outputs.sha != '' && steps.cache-lvgl-linux.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch lvgl_v9 https://gitee.com/realmcu/lvgl.git /tmp/lvgl-src && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
            rm -rf /tmp/lvgl-src
          done
          [ -d /tmp/lvgl-src/.git ] || exit 1

      - name: Build liblvgl.a for Linux
        if: steps.lvgl-info.outputs.sha != '' && steps.cache-lvgl-linux.outputs.cache-hit != 'true'
        run: |
          LVGL_PC_ROOT=$(pwd)/lvgl-pc
          LVGL_SRC=/tmp/lvgl-src
          BUILD_DIR=/tmp/lvgl-build
          INSTALL_DIR=$(pwd)/lvgl-pc/lvgl-lib-linux

          cmake -S "$LVGL_SRC" -B "$BUILD_DIR" \
            -DCMAKE_C_FLAGS="-I$LVGL_PC_ROOT" \
            -DCMAKE_CXX_FLAGS="-I$LVGL_PC_ROOT -D__STDC_FORMAT_MACROS" \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLV_CONF_BUILD_DISABLE_DEMOS=ON \
            -DLV_CONF_BUILD_DISABLE_EXAMPLES=ON

          cp "$LVGL_PC_ROOT/lv_conf.h" "$LVGL_SRC/lv_conf.h"
          cmake --build "$BUILD_DIR" --target install --parallel $(nproc)
          rm -f "$LVGL_SRC/lv_conf.h"

          cp "$LVGL_SRC/lvgl_private.h" "$INSTALL_DIR/include/lvgl/" 2>/dev/null || true

      - name: Check for changes
        id: diff
        run: |
          changes=$(git status --porcelain -- lib/sim/ lvgl-pc/lvgl-lib-linux/)
          if [ -z "$changes" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "🔔 Changes detected"
            echo "$changes"
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "honeygui-bot"
          git config user.email "bot@honeygui.dev"

          git add -A lib/sim/
          git add -A lvgl-pc/lvgl-lib-linux/
          git commit -m "chore: update simulation libraries

          SDK commit: ${{ steps.sdk-info.outputs.sha }}
          SDK message: ${{ steps.sdk-info.outputs.message }}
          LVGL commit: ${{ steps.lvgl-info.outputs.sha }}"

          git push origin HEAD:master

  # ── Win32: libgui.a + liblvgl.a ─────────────────────────────────────
  update-libs-win32:
    runs-on: windows-latest
    needs: update-libs
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-python

      - name: Clone HoneyGUI SDK
        run: git clone --depth 1 https://github.com/realmcu/HoneyGUI.git C:/tmp/HoneyGUI

      - name: Get SDK commit info
        id: sdk-info
        shell: pwsh
        run: |
          echo "sha=$(git -C C:/tmp/HoneyGUI rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          echo "message=$(git -C C:/tmp/HoneyGUI log -1 --format=%s)" >> $env:GITHUB_OUTPUT

      - name: Cache Win32 libgui.a
        id: cache-win32
        uses: actions/cache@v4
        with:
          path: C:/tmp/HoneyGUI/lib/gcc/install
          key: libgui-win32-${{ steps.sdk-info.outputs.sha }}

      - name: Build libgui.a for Win32
        if: steps.cache-win32.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          cd /c/tmp/HoneyGUI/lib/gcc
          mkdir -p build && cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
          cmake --build . --target install

      - name: Update lib/sim/win32 with built library
        shell: pwsh
        run: |
          $src = "C:/tmp/HoneyGUI/lib/gcc/install/lib/libgui.a"
          if (Test-Path $src) {
            Copy-Item $src "lib/sim/win32/libgui.a" -Force
            Write-Output "✅ Win32 libgui.a updated"
          } else {
            Write-Error "libgui.a not found at $src"
            exit 1
          }

      - name: Get LVGL commit hash
        id: lvgl-info
        shell: pwsh
        run: |
          $sha = ""
          for ($i = 1; $i -le 3; $i++) {
            $result = git ls-remote https://gitee.com/realmcu/lvgl.git refs/heads/lvgl_v9
            if ($result) { $sha = ($result -split '\s+')[0]; break }
            Write-Output "Attempt $i failed, retrying in 5s..."
            Start-Sleep -Seconds 5
          }
          if (-not $sha) { Write-Output "⚠️ Failed to get LVGL sha after 3 attempts, skipping LVGL update" }
          echo "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Cache Win32 liblvgl.a
        id: cache-lvgl-win32
        if: steps.lvgl-info.outputs.sha != ''
        uses: actions/cache@v4
        with:
          path: lvgl-pc/lvgl-lib
          key: liblvgl-win32-${{ steps.lvgl-info.outputs.sha }}-${{ hashFiles('lvgl-pc/lv_conf.h') }}

      - name: Clone LVGL source
        if: steps.lvgl-info.outputs.sha != '' && steps.cache-lvgl-win32.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            git clone --depth 1 --branch lvgl_v9 https://gitee.com/realmcu/lvgl.git C:/tmp/lvgl-src
            if ($LASTEXITCODE -eq 0) { break }
            Write-Output "Attempt $i failed, retrying in 5s..."
            Start-Sleep -Seconds 5
            Remove-Item -Recurse -Force C:/tmp/lvgl-src -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path "C:/tmp/lvgl-src/.git")) { exit 1 }

      - name: Build liblvgl.a for Win32
        if: steps.lvgl-info.outputs.sha != '' && steps.cache-lvgl-win32.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          $lvglPcRoot = (Resolve-Path "lvgl-pc").Path
          $installDir = (Resolve-Path ".").Path + "\lvgl-pc\lvgl-lib"
          $lvglSrc = "C:/tmp/lvgl-src"
          $buildDir = "C:/tmp/lvgl-build"

          cmake -S "$lvglSrc" -B "$buildDir" `
            -G "MinGW Makefiles" `
            -DCMAKE_C_FLAGS="-I$lvglPcRoot" `
            -DCMAKE_CXX_FLAGS="-I$lvglPcRoot -D__STDC_FORMAT_MACROS" `
            -DCMAKE_INSTALL_PREFIX="$installDir" `
            -DBUILD_SHARED_LIBS=OFF `
            -DLV_CONF_BUILD_DISABLE_DEMOS=ON `
            -DLV_CONF_BUILD_DISABLE_EXAMPLES=ON

          Copy-Item "$lvglPcRoot/lv_conf.h" "$lvglSrc/lv_conf.h"
          cmake --build "$buildDir" --target install --parallel
          Remove-Item "$lvglSrc/lv_conf.h" -ErrorAction SilentlyContinue

          $privHdr = "$lvglSrc/lvgl_private.h"
          $destDir = "$installDir/include/lvgl"
          if (Test-Path $privHdr) {
            New-Item -ItemType Directory -Force $destDir | Out-Null
            Copy-Item $privHdr $destDir
          }

      - name: Check for changes
        id: diff
        shell: pwsh
        run: |
          $changed = git diff --quiet -- lib/sim/win32/ lvgl-pc/lvgl-lib/
          if ($LASTEXITCODE -ne 0) {
            echo "changed=true" >> $env:GITHUB_OUTPUT
            Write-Output "🔔 Changes detected in Win32 libs"
            git diff --stat -- lib/sim/win32/ lvgl-pc/lvgl-lib/
          } else {
            echo "changed=false" >> $env:GITHUB_OUTPUT
            Write-Output "ℹ️  No changes in Win32 libs"
          }

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        shell: pwsh
        run: |
          git config user.name "honeygui-bot"
          git config user.email "bot@honeygui.dev"

          git add -A lib/sim/win32/
          git add -A lvgl-pc/lvgl-lib/
          git commit -m "chore: update Win32 simulation libraries

          SDK commit: ${{ steps.sdk-info.outputs.sha }}
          SDK message: ${{ steps.sdk-info.outputs.message }}
          LVGL commit: ${{ steps.lvgl-info.outputs.sha }}"

          git pull --rebase origin master
          git push origin HEAD:master
