name: Deploy Web Designer

# 浏览器版设计器（src/web）构建后部署到 GitHub Pages。
# 浏览器版复用 webview / designer / hml / codegen 等共享代码，这些目录变化时也要重新部署。
on:
  push:
    branches: [master]
    paths:
      - 'src/web/**'
      - 'src/webview/**'
      - 'src/designer/**'
      - 'src/hml/**'
      - 'src/codegen/**'
      - 'src/services/**'
      - 'src/utils/**'
      - 'src/common/**'
      - 'src/shared/**'
      - 'src/project-i18n/**'
      - 'src/simulation/**'
      - 'src/template/**'
      - 'tools/image-converter/**'
      - 'tools/font-converter/src/**'
      - 'tools/font-converter/package.json'
      - 'tools/glass-generator/**'
      - 'tools/model-converter/**'
      - 'tools/video-converter-ts/**'
      - 'tools/image-to-jpeg-converter/**'
      - 'lib/web-sim/**'
      - 'scripts/prepare-web-sim.js'
      - 'scripts/prebuild-web-examples.*'
      - 'scripts/prebuild-web-videos.*'
      - 'l10n/**'
      - 'webpack.web.config.js'
      - 'tsconfig.web.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
  # 引擎更新由 honeygui-bot 用 GITHUB_TOKEN 推送，GitHub 不会为该推送触发 push 事件，
  # 因此这里监听那个 workflow：它提交了新引擎，站点要重新部署（失败则跳过，留在旧站点）
  workflow_run:
    workflows: ["Update Simulation Assets"]
    types: [completed]
    branches: [master]
  # 官方模板（honeygui-template-*）更新不会触发 push，靠定时部署跟上：
  # 每次都会重新克隆模板，有改动的单元和工程重新编译，没变的从缓存复制。
  # GitHub 的定时任务在空闲时段可能延迟，cron 时间不必卡得很死。
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署；正在进行的生产部署不取消，避免站点处于半更新状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck:web

      - name: Build web designer
        run: npm run build:web

      # 引擎（快速预览）与完整仿真用的 WASM clang、binaryen、头文件包；编译器只在页面需要编译时下载。
      # 引擎在 lib/web-sim，由 update-sim-assets.yml 更新
      - name: Prepare web simulation
        run: node scripts/prepare-web-sim.js

      # 预编译官方模板与内置示例：未修改的工程完整仿真时直接加载，修改后只重编改动的文件。
      # 产物按键（含工具链标识）缓存，只编新增或改动的单元
      - name: Restore prebuilt cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/honeygui-web-prebuilt
          key: web-prebuilt-${{ github.run_id }}
          restore-keys: web-prebuilt-

      - name: Prebuild web examples
        run: node scripts/prebuild-web-examples.js --cache ~/.cache/honeygui-web-prebuilt

      # 浏览器里没有 FFmpeg：官方模板与内置示例里的视频在这里用原生 FFmpeg 预转换，页面按键下载。
      # CINEPAK 转一段视频要一分钟左右，转换结果按键缓存，只转新增或改动的视频
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Restore video cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/honeygui-web-videos
          key: web-videos-${{ github.run_id }}
          restore-keys: web-videos-

      - name: Prebuild web videos
        run: node scripts/prebuild-web-videos.js --cache ~/.cache/honeygui-web-videos

      # Source map 只用于本地调试，不发布
      - name: Remove source maps
        run: find dist/web -name '*.map' -delete

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
