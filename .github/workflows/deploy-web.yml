name: Deploy Web Designer

# 浏览器版设计器（src/web）构建后部署到 GitHub Pages。
# 浏览器版复用 webview / designer / hml / codegen 等共享代码，这些目录变化时也要重新部署。
on:
  push:
    branches: [master]
    paths:
      - 'src/web/**'
      - 'src/webview/**'
      - 'src/designer/**'
      - 'src/hml/**'
      - 'src/codegen/**'
      - 'src/services/**'
      - 'src/utils/**'
      - 'src/common/**'
      - 'src/shared/**'
      - 'src/project-i18n/**'
      - 'tools/image-converter/**'
      - 'tools/font-converter/src/**'
      - 'tools/font-converter/package.json'
      - 'l10n/**'
      - 'webpack.web.config.js'
      - 'tsconfig.web.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署；正在进行的生产部署不取消，避免站点处于半更新状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck:web

      - name: Build web designer
        run: npm run build:web

      # Source map 只用于本地调试，不发布
      - name: Remove source maps
        run: find dist/web -name '*.map' -delete

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
