name: Deploy Web Designer

# 浏览器版设计器（src/web）构建后部署到 GitHub Pages。
# 浏览器版复用 webview / designer / hml / codegen 等共享代码，这些目录变化时也要重新部署。
on:
  push:
    branches: [master]
    paths:
      - 'src/web/**'
      - 'src/webview/**'
      - 'src/designer/**'
      - 'src/hml/**'
      - 'src/codegen/**'
      - 'src/services/**'
      - 'src/utils/**'
      - 'src/common/**'
      - 'src/shared/**'
      - 'src/project-i18n/**'
      - 'src/simulation/**'
      - 'src/template/**'
      - 'tools/image-converter/**'
      - 'tools/font-converter/src/**'
      - 'tools/font-converter/package.json'
      - 'tools/glass-generator/**'
      - 'tools/model-converter/**'
      - 'tools/video-converter-ts/**'
      - 'tools/image-to-jpeg-converter/**'
      - 'lib/web-sim/**'
      - 'scripts/prepare-web-sim.js'
      - 'l10n/**'
      - 'webpack.web.config.js'
      - 'tsconfig.web.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
  # 引擎更新由 honeygui-bot 用 GITHUB_TOKEN 推送，GitHub 不会为该推送触发 push 事件，
  # 因此这里监听那个 workflow：它提交了新引擎，站点要重新部署（失败则跳过，留在旧站点）
  workflow_run:
    workflows: ["Update Simulation Assets"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署；正在进行的生产部署不取消，避免站点处于半更新状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck:web

      - name: Build web designer
        run: npm run build:web

      # 浏览器仿真：引擎（lib/web-sim，由 update-sim-assets.yml 更新）、编译器与头文件
      - name: Prepare web simulation
        run: node scripts/prepare-web-sim.js

      # Source map 只用于本地调试，不发布
      - name: Remove source maps
        run: find dist/web -name '*.map' -delete

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
