name: Sync skill mirror

# 把 vibe-designer/skills/honeygui-designer 目录同步到多 skill 集合仓库
# realmcu/skills（main 分支）的 skills/honeygui-designer/ 子目录，供公司 AI Plugin Hub /
# Claude Code 等按 skill 目录扫描。镜像仓库结构对齐 anthropics/skills。
#
# 机制见 scripts/sync-skill.sh：子目录内容拷贝，只覆盖镜像里 skills/honeygui-designer/ 这一个
# 子目录，其他开发者上传的 skill 不受影响；每次同步一笔 squash 提交，提交信息沿用源仓库
# 对应改动的标题并标注来源 SHA。只在该目录真正有改动进入 master 时触发；也可手动触发。
on:
  push:
    branches: [master]
    paths:
      - 'vibe-designer/skills/honeygui-designer/**'
  workflow_dispatch:

# 同一时间只跑一个同步，防止并发推送互相打架
concurrency:
  group: sync-skill-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 拉全历史，让 scripts/sync-skill.sh 里的 `git log -1 -- <skill 路径>` 能可靠找到
      # 最近一笔改动该 skill 的 commit（用于生成同步提交的标题与来源 SHA）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # clone + push 镜像仓库(realmcu/skills)都需要独立凭据，默认 GITHUB_TOKEN 只对当前仓库
      # 有效。这里用 deploy key(带写权限，clone/push 通用)：
      #   1. 生成密钥：ssh-keygen -t ed25519 -f skills_deploy -N ""
      #   2. skills_deploy.pub 加到 realmcu/skills 的 Deploy keys，勾选 Allow write access
      #   3. skills_deploy(私钥) 加到本仓库 Secrets，命名 SKILLS_DEPLOY_KEY
      - name: Setup SSH deploy key for mirror repo
        env:
          DEPLOY_KEY: ${{ secrets.SKILLS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync skill to mirror
        run: bash scripts/sync-skill.sh
