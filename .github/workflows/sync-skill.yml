name: Sync skill mirror

# 把 vibe-designer/skills/honeygui-designer 目录同步到独立镜像仓库
# realmcu/skills（main 分支），供公司 AI Plugin Hub 扫描。
# 用 git subtree split/push，保留子目录的完整逐笔历史；split 遍历全历史较慢，
# 交由 CI 吸收这段时间。只在该目录真正有改动进入 master 时触发；也可手动触发。
on:
  push:
    branches: [master]
    paths:
      - 'vibe-designer/skills/honeygui-designer/**'
  workflow_dispatch:

# 同一时间只跑一个同步，防止并发推送互相打架
concurrency:
  group: sync-skill-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # subtree split 需要完整历史，必须 fetch-depth: 0（默认的浅克隆会不完整）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 向另一个仓库(realmcu/skills)推送需要独立凭据，默认 GITHUB_TOKEN
      # 只对当前仓库有效。这里用 deploy key：
      #   1. 生成密钥：ssh-keygen -t ed25519 -f skills_deploy -N ""
      #   2. skills_deploy.pub 加到 realmcu/skills 的 Deploy keys，勾选 Allow write access
      #   3. skills_deploy(私钥) 加到本仓库 Secrets，命名 SKILLS_DEPLOY_KEY
      - name: Setup SSH deploy key for mirror repo
        env:
          DEPLOY_KEY: ${{ secrets.SKILLS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync skill to mirror
        run: bash scripts/sync-skill.sh
