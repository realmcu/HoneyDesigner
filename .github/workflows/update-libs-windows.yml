name: Update Simulation Libraries (Windows)

# 在 Linux 仿真库更新成功后运行：Linux 侧负责同步 win32_sim 源码与头文件，
# 本 workflow 只补 Win32 的 libgui.a / liblvgl.a，串行执行避免两边同时 push 冲突。
on:
  workflow_run:
    workflows: ["Update Simulation Libraries (Linux)"]
    types: [completed]
    branches: [master]
  workflow_dispatch:           # 手动触发

jobs:
  update-libs-windows:
    runs-on: windows-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── GCC 8.1.0 posix/sjlj — matches SDL2 static lib ABI ───────────

      - name: Restore cached MinGW 8.1.0
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: C:\mingw810
          key: mingw-8.1.0-posix-sjlj-win

      - name: Download and extract MinGW 8.1.0 (posix, sjlj)
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\mingw810 | Out-Null
          $url = "https://sourceforge.net/projects/mingw-w64/files/Toolchains%20targetting%20Win64/Personal%20Builds/mingw-builds/8.1.0/threads-posix/sjlj/x86_64-8.1.0-release-posix-sjlj-rt_v6-rev0.7z/download"
          curl.exe -L --retry 3 -o C:\mingw810.7z $url
          7z x C:\mingw810.7z -oC:\mingw810 -y | Out-Null
          Write-Output "MinGW 8.1.0 extracted to C:\mingw810"

      - name: Add MinGW 8.1.0 to PATH
        shell: pwsh
        run: echo "C:\mingw810\mingw64\bin" >> $env:GITHUB_PATH

      - name: Verify MinGW version
        shell: pwsh
        run: |
          & "C:\mingw810\mingw64\bin\gcc.exe" -v 2>&1

      - name: Clone HoneyGUI SDK
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/realmcu/HoneyGUI.git C:/tmp/HoneyGUI
          # describe needs the ancestry back to the nearest tag (~300+ commits),
          # so unshallow; blob:none keeps it to commit/tree metadata, not file history
          git -C C:/tmp/HoneyGUI fetch --tags --unshallow --filter=blob:none

      - name: Get SDK commit info
        id: sdk-info
        shell: pwsh
        run: |
          echo "sha=$(git -C C:/tmp/HoneyGUI rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          echo "message=$(git -C C:/tmp/HoneyGUI log -1 --format=%s)" >> $env:GITHUB_OUTPUT

      - name: Cache Win32 libgui.a
        id: cache-win32
        uses: actions/cache@v4
        with:
          path: C:/tmp/HoneyGUI/lib/gcc/install
          key: libgui-win32-gcc810-${{ steps.sdk-info.outputs.sha }}

      - name: Build libgui.a for Win32
        if: steps.cache-win32.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-Location C:/tmp/HoneyGUI/lib/gcc
          New-Item -ItemType Directory -Force build | Out-Null
          Set-Location build
          cmake .. -G "MinGW Makefiles" `
            -DCMAKE_C_COMPILER="C:/mingw810/mingw64/bin/gcc.exe" `
            -DCMAKE_CXX_COMPILER="C:/mingw810/mingw64/bin/g++.exe" `
            -DCMAKE_MAKE_PROGRAM="C:/mingw810/mingw64/bin/mingw32-make.exe"
          cmake --build . -j4
          cmake --build . --target install

      - name: Update lib/sim/win32 with built library
        shell: pwsh
        run: |
          $src = "C:/tmp/HoneyGUI/lib/gcc/install/lib/libgui.a"
          if (Test-Path $src) {
            Copy-Item $src "lib/sim/win32/libgui.a" -Force
            Write-Output "✅ Win32 libgui.a updated"
          } else {
            Write-Error "libgui.a not found at $src"
            exit 1
          }

      - name: Get LVGL commit hash
        id: lvgl-info
        shell: pwsh
        run: |
          $sha = ""
          for ($i = 1; $i -le 3; $i++) {
            $result = git ls-remote https://gitee.com/realmcu/lvgl.git refs/heads/lvgl_v9
            if ($result) { $sha = ($result -split '\s+')[0]; break }
            Write-Output "Attempt $i failed, retrying in 5s..."
            Start-Sleep -Seconds 5
          }
          if (-not $sha) { Write-Output "⚠️ Failed to get LVGL sha after 3 attempts, skipping LVGL update" }
          echo "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Cache Win32 liblvgl.a
        id: cache-lvgl-win32
        if: steps.lvgl-info.outputs.sha != ''
        uses: actions/cache@v4
        with:
          path: lvgl-pc/lvgl-lib
          key: liblvgl-win32-gcc810-${{ steps.lvgl-info.outputs.sha }}-${{ hashFiles('lvgl-pc/lv_conf.h') }}

      - name: Clone LVGL source
        if: steps.lvgl-info.outputs.sha != '' && steps.cache-lvgl-win32.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            git clone --depth 1 --branch lvgl_v9 https://gitee.com/realmcu/lvgl.git C:/tmp/lvgl-src
            if ($LASTEXITCODE -eq 0) { break }
            Write-Output "Attempt $i failed, retrying in 5s..."
            Start-Sleep -Seconds 5
            Remove-Item -Recurse -Force C:/tmp/lvgl-src -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path "C:/tmp/lvgl-src/.git")) { exit 1 }

      - name: Build liblvgl.a for Win32
        if: steps.lvgl-info.outputs.sha != '' && steps.cache-lvgl-win32.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $lvglPcRoot = (Resolve-Path "lvgl-pc").Path
          $installDir = (Resolve-Path ".").Path + "\lvgl-pc\lvgl-lib"
          $lvglSrc = "C:/tmp/lvgl-src"
          $buildDir = "C:/tmp/lvgl-build"

          cmake -S "$lvglSrc" -B "$buildDir" `
            -G "MinGW Makefiles" `
            -DCMAKE_C_COMPILER="C:/mingw810/mingw64/bin/gcc.exe" `
            -DCMAKE_CXX_COMPILER="C:/mingw810/mingw64/bin/g++.exe" `
            -DCMAKE_MAKE_PROGRAM="C:/mingw810/mingw64/bin/mingw32-make.exe" `
            -DCMAKE_C_FLAGS="-I$lvglPcRoot" `
            -DCMAKE_CXX_FLAGS="-I$lvglPcRoot -D__STDC_FORMAT_MACROS" `
            -DCMAKE_INSTALL_PREFIX="$installDir" `
            -DBUILD_SHARED_LIBS=OFF `
            -DLV_CONF_BUILD_DISABLE_DEMOS=ON `
            -DLV_CONF_BUILD_DISABLE_EXAMPLES=ON

          Copy-Item "$lvglPcRoot/lv_conf.h" "$lvglSrc/lv_conf.h"
          cmake --build "$buildDir" --target install --parallel
          Remove-Item "$lvglSrc/lv_conf.h" -ErrorAction SilentlyContinue

          $privHdr = "$lvglSrc/lvgl_private.h"
          $destDir = "$installDir/include/lvgl"
          if (Test-Path $privHdr) {
            New-Item -ItemType Directory -Force $destDir | Out-Null
            Copy-Item $privHdr $destDir
          }

      - name: Check for changes
        id: diff
        shell: pwsh
        run: |
          $changed = git diff --quiet -- lib/sim/win32/ lvgl-pc/lvgl-lib/
          if ($LASTEXITCODE -ne 0) {
            echo "changed=true" >> $env:GITHUB_OUTPUT
            Write-Output "🔔 Changes detected in Win32 libs"
            git diff --stat -- lib/sim/win32/ lvgl-pc/lvgl-lib/
          } else {
            echo "changed=false" >> $env:GITHUB_OUTPUT
            Write-Output "ℹ️  No changes in Win32 libs"
          }

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        shell: pwsh
        env:
          SDK_SHA: ${{ steps.sdk-info.outputs.sha }}
          SDK_MESSAGE: ${{ steps.sdk-info.outputs.message }}
          LVGL_SHA: ${{ steps.lvgl-info.outputs.sha }}
        run: |
          git config user.name "honeygui-bot"
          git config user.email "bot@honeygui.dev"

          git add -A lib/sim/win32/
          git add -A lvgl-pc/lvgl-lib/
          @(
            "chore: update Win32 simulation libraries"
            ""
            "SDK commit: $env:SDK_SHA"
            "SDK message: $env:SDK_MESSAGE"
            "LVGL commit: $env:LVGL_SHA"
          ) | Set-Content -Path "$env:RUNNER_TEMP/update-libs-commit.txt"
          git commit -F "$env:RUNNER_TEMP/update-libs-commit.txt"

          git pull --rebase origin master
          git push origin HEAD:master
