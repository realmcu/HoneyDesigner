name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile TypeScript
        run: npm run compile

      - name: Build Webview
        run: npm run build:webview

      - name: Unit Tests
        run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        template:
          - name: smartwatch
            repo: honeygui-template-smartwatch
            engine: honeygui
          - name: dashboard
            repo: honeygui-template-dashboard
            engine: honeygui
          - name: chatbot
            repo: honeygui-template-chatbot
            engine: honeygui
          - name: rotary
            repo: honeygui-template-rotary
            engine: honeygui
          - name: settings
            repo: honeygui-template-settings
            engine: honeygui
          - name: lvgl-test
            repo: lvgl-template-test
            engine: lvgl

    name: e2e (${{ matrix.template.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev xvfb python3-pip cmake
          pip install scons kconfiglib

      - name: Install npm dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      # ── HoneyGUI engine: build libgui.a ────────────────────────────────────

      - name: Clone HoneyGUI SDK
        if: matrix.template.engine == 'honeygui'
        run: git clone --depth 1 https://github.com/realmcu/HoneyGUI.git /tmp/HoneyGUI

      - name: Get HoneyGUI commit hash
        if: matrix.template.engine == 'honeygui'
        id: honeygui-hash
        run: echo "sha=$(git -C /tmp/HoneyGUI rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache libgui.a build
        if: matrix.template.engine == 'honeygui'
        id: cache-libgui
        uses: actions/cache@v4
        with:
          path: /tmp/HoneyGUI/lib/gcc/install
          key: libgui-${{ steps.honeygui-hash.outputs.sha }}

      - name: Build libgui.a from source
        if: matrix.template.engine == 'honeygui' && steps.cache-libgui.outputs.cache-hit != 'true'
        run: |
          cd /tmp/HoneyGUI/lib/gcc
          mkdir -p build && cd build
          cmake ..
          make -j$(nproc)
          make install

      - name: Update lib/sim with freshly built library
        if: matrix.template.engine == 'honeygui'
        run: |
          cp /tmp/HoneyGUI/lib/gcc/install/lib/libgui.a lib/sim/linux/libgui.a
          rm -rf lib/sim/include/*
          cp -r /tmp/HoneyGUI/lib/gcc/install/include/* lib/sim/include/

      # ── LVGL engine: build liblvgl.a ───────────────────────────────────────

      - name: Clone LVGL source
        if: matrix.template.engine == 'lvgl'
        run: git clone --depth 1 --branch lvgl_v9 https://gitee.com/realmcu/lvgl.git /tmp/lvgl-src

      - name: Get LVGL commit hash
        if: matrix.template.engine == 'lvgl'
        id: lvgl-hash
        run: echo "sha=$(git -C /tmp/lvgl-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache liblvgl.a build
        if: matrix.template.engine == 'lvgl'
        id: cache-liblvgl
        uses: actions/cache@v4
        with:
          path: lvgl-pc/lvgl-lib
          key: liblvgl-${{ steps.lvgl-hash.outputs.sha }}-${{ hashFiles('lvgl-pc/lv_conf.h') }}

      - name: Build and install liblvgl.a
        if: matrix.template.engine == 'lvgl' && steps.cache-liblvgl.outputs.cache-hit != 'true'
        run: |
          LVGL_PC_ROOT=$(pwd)/lvgl-pc
          LVGL_SRC=/tmp/lvgl-src
          BUILD_DIR=/tmp/lvgl-build

          cmake -S "$LVGL_SRC" -B "$BUILD_DIR" \
            -DCMAKE_C_FLAGS="-I$LVGL_PC_ROOT" \
            -DCMAKE_CXX_FLAGS="-I$LVGL_PC_ROOT -D__STDC_FORMAT_MACROS" \
            -DCMAKE_INSTALL_PREFIX="$LVGL_PC_ROOT/lvgl-lib" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLV_CONF_BUILD_DISABLE_DEMOS=ON \
            -DLV_CONF_BUILD_DISABLE_EXAMPLES=ON

          cp "$LVGL_PC_ROOT/lv_conf.h" "$LVGL_SRC/lv_conf.h"
          cmake --build "$BUILD_DIR" --target install --parallel $(nproc)
          rm -f "$LVGL_SRC/lv_conf.h"

          # Copy root-level header that cmake install may omit
          cp "$LVGL_SRC/lvgl_private.h" "$LVGL_PC_ROOT/lvgl-lib/include/lvgl/" 2>/dev/null || true

      # ── Common: clone template and run tests ───────────────────────────────

      - name: Clone template project
        run: git clone --depth 1 https://github.com/realmcu/${{ matrix.template.repo }}.git /tmp/test-project

      - name: Run E2E tests
        env:
          TEST_WORKSPACE: /tmp/test-project
        run: xvfb-run -a npm run test:e2e

  # ── Auto-update simulation libraries (on push to master only) ─────────
  update-libs:
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Clone HoneyGUI SDK
        run: git clone --depth 1 https://github.com/realmcu/HoneyGUI.git /tmp/HoneyGUI

      - name: Get SDK commit info
        id: sdk-info
        run: |
          echo "sha=$(git -C /tmp/HoneyGUI rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "message=$(git -C /tmp/HoneyGUI log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      # ── Linux build (CMake) ─────────────────────────────────

      - name: Cache Linux libgui.a
        id: cache-linux
        uses: actions/cache@v4
        with:
          path: /tmp/HoneyGUI/lib/gcc/install
          key: libgui-linux-${{ steps.sdk-info.outputs.sha }}

      - name: Build libgui.a for Linux
        if: steps.cache-linux.outputs.cache-hit != 'true'
        run: |
          cd /tmp/HoneyGUI/lib/gcc
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          make install

      # ── Copy built files into repo ──────────────────────────

      - name: Update lib/sim with freshly built library
        run: |
          # Linux lib
          if [ -f /tmp/HoneyGUI/lib/gcc/install/lib/libgui.a ]; then
            cp /tmp/HoneyGUI/lib/gcc/install/lib/libgui.a lib/sim/linux/libgui.a
            echo "✅ Linux libgui.a updated"
          fi

          # Headers
          if [ -d /tmp/HoneyGUI/lib/gcc/install/include ]; then
            rm -rf lib/sim/include/*
            cp -r /tmp/HoneyGUI/lib/gcc/install/include/* lib/sim/include/
            echo "✅ Headers updated"
          fi

      # ── LVGL Linux build ───────────────────────────────────────

      - name: Clone LVGL source
        run: git clone --depth 1 --branch lvgl_v9 https://gitee.com/realmcu/lvgl.git /tmp/lvgl-src

      - name: Get LVGL commit hash
        id: lvgl-info
        run: echo "sha=$(git -C /tmp/lvgl-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Linux liblvgl.a
        id: cache-lvgl-linux
        uses: actions/cache@v4
        with:
          path: lvgl-pc/lvgl-lib-linux
          key: liblvgl-linux-${{ steps.lvgl-info.outputs.sha }}-${{ hashFiles('lvgl-pc/lv_conf.h') }}

      - name: Build liblvgl.a for Linux
        if: steps.cache-lvgl-linux.outputs.cache-hit != 'true'
        run: |
          LVGL_PC_ROOT=$(pwd)/lvgl-pc
          LVGL_SRC=/tmp/lvgl-src
          BUILD_DIR=/tmp/lvgl-build
          INSTALL_DIR=$(pwd)/lvgl-pc/lvgl-lib-linux

          cmake -S "$LVGL_SRC" -B "$BUILD_DIR" \
            -DCMAKE_C_FLAGS="-I$LVGL_PC_ROOT" \
            -DCMAKE_CXX_FLAGS="-I$LVGL_PC_ROOT -D__STDC_FORMAT_MACROS" \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLV_CONF_BUILD_DISABLE_DEMOS=ON \
            -DLV_CONF_BUILD_DISABLE_EXAMPLES=ON

          cp "$LVGL_PC_ROOT/lv_conf.h" "$LVGL_SRC/lv_conf.h"
          cmake --build "$BUILD_DIR" --target install --parallel $(nproc)
          rm -f "$LVGL_SRC/lv_conf.h"

          cp "$LVGL_SRC/lvgl_private.h" "$INSTALL_DIR/include/lvgl/" 2>/dev/null || true

      - name: Check for changes
        id: diff
        run: |
          changes=$(git status --porcelain -- lib/sim/ lvgl-pc/lvgl-lib-linux/)
          if [ -z "$changes" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "🔔 Changes detected"
            echo "$changes"
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "honeygui-bot"
          git config user.email "bot@honeygui.dev"

          git add -A lib/sim/
          git add -A lvgl-pc/lvgl-lib-linux/
          git commit -m "chore: update simulation libraries

          SDK commit: ${{ steps.sdk-info.outputs.sha }}
          SDK message: ${{ steps.sdk-info.outputs.message }}
          LVGL commit: ${{ steps.lvgl-info.outputs.sha }}

          [skip ci]"

          # Push explicitly to master branch (checkout is in detached HEAD)
          git push origin HEAD:master

  # ── Auto-update Win32 simulation libraries (on push to master only) ───
  update-libs-win32:
    runs-on: windows-latest
    needs: update-libs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-python

      # ── HoneyGUI Win32 build ────────────────────────────────────────────

      - name: Clone HoneyGUI SDK
        run: git clone --depth 1 https://github.com/realmcu/HoneyGUI.git C:/tmp/HoneyGUI

      - name: Get SDK commit info
        id: sdk-info
        shell: pwsh
        run: |
          echo "sha=$(git -C C:/tmp/HoneyGUI rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          echo "message=$(git -C C:/tmp/HoneyGUI log -1 --format=%s)" >> $env:GITHUB_OUTPUT

      - name: Cache Win32 libgui.a
        id: cache-win32
        uses: actions/cache@v4
        with:
          path: C:/tmp/HoneyGUI/lib/gcc/install
          key: libgui-win32-${{ steps.sdk-info.outputs.sha }}

      - name: Build libgui.a for Win32
        if: steps.cache-win32.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          cd /c/tmp/HoneyGUI/lib/gcc
          mkdir -p build && cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
          cmake --build . --target install

      - name: Update lib/sim/win32 with built library
        shell: pwsh
        run: |
          $src = "C:/tmp/HoneyGUI/lib/gcc/install/lib/libgui.a"
          if (Test-Path $src) {
            Copy-Item $src "lib/sim/win32/libgui.a" -Force
            Write-Output "✅ Win32 libgui.a updated"
          } else {
            Write-Error "libgui.a not found at $src"
            exit 1
          }

      # ── LVGL Win32 build ────────────────────────────────────────────────

      - name: Clone LVGL source
        run: git clone --depth 1 --branch lvgl_v9 https://gitee.com/realmcu/lvgl.git C:/tmp/lvgl-src

      - name: Get LVGL commit hash
        id: lvgl-info
        shell: pwsh
        run: echo "sha=$(git -C C:/tmp/lvgl-src rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Cache Win32 liblvgl.a
        id: cache-lvgl-win32
        uses: actions/cache@v4
        with:
          path: lvgl-pc/lvgl-lib-win32
          key: liblvgl-win32-${{ steps.lvgl-info.outputs.sha }}-${{ hashFiles('lvgl-pc/lv_conf.h') }}

      - name: Build liblvgl.a for Win32
        if: steps.cache-lvgl-win32.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          $lvglPcRoot = (Resolve-Path "lvgl-pc").Path
          $installDir = (Resolve-Path ".").Path + "\lvgl-pc\lvgl-lib-win32"
          $lvglSrc = "C:/tmp/lvgl-src"
          $buildDir = "C:/tmp/lvgl-build"

          cmake -S "$lvglSrc" -B "$buildDir" `
            -G "MinGW Makefiles" `
            -DCMAKE_C_FLAGS="-I$lvglPcRoot" `
            -DCMAKE_CXX_FLAGS="-I$lvglPcRoot -D__STDC_FORMAT_MACROS" `
            -DCMAKE_INSTALL_PREFIX="$installDir" `
            -DBUILD_SHARED_LIBS=OFF `
            -DLV_CONF_BUILD_DISABLE_DEMOS=ON `
            -DLV_CONF_BUILD_DISABLE_EXAMPLES=ON

          Copy-Item "$lvglPcRoot/lv_conf.h" "$lvglSrc/lv_conf.h"
          cmake --build "$buildDir" --target install --parallel
          Remove-Item "$lvglSrc/lv_conf.h" -ErrorAction SilentlyContinue

          $privHdr = "$lvglSrc/lvgl_private.h"
          $destDir = "$installDir/include/lvgl"
          if (Test-Path $privHdr) {
            New-Item -ItemType Directory -Force $destDir | Out-Null
            Copy-Item $privHdr $destDir
          }

      # ── Commit and push if changed ──────────────────────────────────────

      - name: Check for changes
        id: diff
        shell: pwsh
        run: |
          $changed = git diff --quiet -- lib/sim/win32/ lvgl-pc/lvgl-lib-win32/
          if ($LASTEXITCODE -ne 0) {
            echo "changed=true" >> $env:GITHUB_OUTPUT
            Write-Output "🔔 Changes detected in Win32 libs"
            git diff --stat -- lib/sim/win32/ lvgl-pc/lvgl-lib-win32/
          } else {
            echo "changed=false" >> $env:GITHUB_OUTPUT
            Write-Output "ℹ️  No changes in Win32 libs"
          }

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        shell: pwsh
        run: |
          git config user.name "honeygui-bot"
          git config user.email "bot@honeygui.dev"

          git add -A lib/sim/win32/
          git add -A lvgl-pc/lvgl-lib-win32/
          git commit -m "chore: update Win32 simulation libraries

          SDK commit: ${{ steps.sdk-info.outputs.sha }}
          SDK message: ${{ steps.sdk-info.outputs.message }}
          LVGL commit: ${{ steps.lvgl-info.outputs.sha }}

          [skip ci]"

          git pull --rebase origin master
          git push origin HEAD:master
