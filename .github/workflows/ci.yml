name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_run:
    workflows: ["Update Simulation Libraries"]
    types: [completed]
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile TypeScript
        run: npm run compile

      - name: Build Webview
        run: npm run build:webview

      - name: Unit Tests
        run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        template:
          - name: smartwatch
            repo: honeygui-template-smartwatch
            engine: honeygui
          - name: dashboard
            repo: honeygui-template-dashboard
            engine: honeygui
          - name: chatbot
            repo: honeygui-template-chatbot
            engine: honeygui
          - name: rotary
            repo: honeygui-template-rotary
            engine: honeygui
          - name: settings
            repo: honeygui-template-settings
            engine: honeygui
          - name: lvgl-test
            repo: lvgl-template-test
            engine: lvgl

    name: e2e (${{ matrix.template.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev xvfb python3-pip cmake
          pip install scons kconfiglib

      - name: Install npm dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      # ── Common: clone template and run tests ───────────────────────────────

      - name: Clone template project
        run: git clone --depth 1 https://github.com/realmcu/${{ matrix.template.repo }}.git /tmp/test-project

      - name: Run E2E tests
        env:
          TEST_WORKSPACE: /tmp/test-project
        run: xvfb-run -a npm run test:e2e

  e2e-win32:
    runs-on: windows-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        template:
          - name: smartwatch
            repo: honeygui-template-smartwatch
            engine: honeygui
          - name: dashboard
            repo: honeygui-template-dashboard
            engine: honeygui
          - name: chatbot
            repo: honeygui-template-chatbot
            engine: honeygui
          - name: rotary
            repo: honeygui-template-rotary
            engine: honeygui
          - name: settings
            repo: honeygui-template-settings
            engine: honeygui
          - name: lvgl-test
            repo: lvgl-template-test
            engine: lvgl

    name: e2e-win (${{ matrix.template.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scons
        run: pip install scons kconfiglib

      # MinGW 8.1.0 posix-sjlj —— 必须与 lib/sim/win32/libgui.a 的编译工具链一致，
      # 否则异常模型(sjlj vs SEH)和 libstdc++ ABI 不匹配会导致链接失败。
      # 解压到 C:\mingw64 以对齐 menu_config.py 的默认 EXEC_PATH。
      - name: Restore cached MinGW 8.1.0
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: C:\mingw64
          key: mingw-8.1.0-posix-sjlj-e2e

      - name: Download and extract MinGW 8.1.0 (posix, sjlj)
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        run: |
          $url = "https://sourceforge.net/projects/mingw-w64/files/Toolchains%20targetting%20Win64/Personal%20Builds/mingw-builds/8.1.0/threads-posix/sjlj/x86_64-8.1.0-release-posix-sjlj-rt_v6-rev0.7z/download"
          curl.exe -L --retry 3 -o C:\mingw.7z $url
          7z x C:\mingw.7z -oC:\ -y | Out-Null
          Write-Output "MinGW 8.1.0 extracted to C:\mingw64"

      - name: Add MinGW 8.1.0 to PATH
        run: echo "C:\mingw64\bin" >> $env:GITHUB_PATH

      - name: Verify MinGW version
        run: gcc --version

      - name: Install npm dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      # ── Common: clone template and run tests ───────────────────────────────

      - name: Clone template project
        run: git clone --depth 1 https://github.com/realmcu/${{ matrix.template.repo }}.git C:\test-project

      - name: Run E2E tests
        env:
          TEST_WORKSPACE: C:\test-project
        run: npm run test:e2e

