name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_run:
    workflows: ["Update Simulation Libraries"]
    types: [completed]
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile TypeScript
        run: npm run compile

      - name: Build Webview
        run: npm run build:webview

      - name: Unit Tests
        run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        template:
          - name: smartwatch
            repo: honeygui-template-smartwatch
            engine: honeygui
          - name: dashboard
            repo: honeygui-template-dashboard
            engine: honeygui
          - name: chatbot
            repo: honeygui-template-chatbot
            engine: honeygui
          - name: rotary
            repo: honeygui-template-rotary
            engine: honeygui
          - name: settings
            repo: honeygui-template-settings
            engine: honeygui
          - name: lvgl-test
            repo: lvgl-template-test
            engine: lvgl

    name: e2e (${{ matrix.template.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev xvfb python3-pip cmake
          pip install scons kconfiglib

      - name: Install npm dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      # ── Common: clone template and run tests ───────────────────────────────

      - name: Clone template project
        run: git clone --depth 1 https://github.com/realmcu/${{ matrix.template.repo }}.git /tmp/test-project

      - name: Run E2E tests
        env:
          TEST_WORKSPACE: /tmp/test-project
        run: xvfb-run -a npm run test:e2e

